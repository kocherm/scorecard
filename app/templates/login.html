<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Aprendio Scorecard</title>
{% include "_head_icons.html" %}
<link rel="stylesheet" href="/static/scorecard.css?v={{ static_v }}">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="brandline"><span class="seam"></span><span class="wordmark">APRENDIO</span></div>
    <h1>Company Scorecard</h1>
    {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus
             autocomplete="username webauthn">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required
             autocomplete="current-password">
      <button class="btn" type="submit">Sign in</button>
    </form>
    <p class="page-sub" style="margin-top:14px"><a href="/forgot">Forgot your password?</a></p>
    {% if passkeys_on %}
    <div data-passkey-block style="margin-top:18px">
      <div id="passkey-error"></div>
      <button class="btn secondary" type="button" id="passkey-signin"
              style="width:100%">Sign in with a passkey</button>
    </div>
    <script src="/static/passkey.js?v={{ static_v }}" defer></script>
    {% endif %}
  </div>
</body>
</html>
